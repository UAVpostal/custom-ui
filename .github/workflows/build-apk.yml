name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to publish the APK as a release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: cogco-home-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Puts the APK on the repository's Releases page, so it can be downloaded
      # straight from a phone browser without unzipping anything:
      # https://github.com/<owner>/<repo>/releases/latest/download/cogco-home.apk
      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk cogco-home.apk
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build cogco-home.apk \
            --target "${{ github.sha }}" \
            --latest \
            --title "Cogco Home (latest build)" \
            --notes "Built from commit ${{ github.sha }}. Download cogco-home.apk below and open it to install."
